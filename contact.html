    <section id="contact" class="contact section">

      <div class="container section-title" data-aos="fade-up">
        <h2>Contact</h2>
        <p>Feel free to contact via phone or email!</p>
      </div>

      <div class="container" data-aos="fade-up" data-aos-delay="100">
        <div class="row gy-4">

          <div class="col-lg-5">
            <div class="info-wrap">

              <div class="info-item d-flex" data-aos="fade-up" data-aos-delay="400">
                <i class="bi bi-envelope flex-shrink-0"></i>
                <div>
                  <h3>Email</h3>
                  <p><a href="mailto:akritikarki126@gmail.com">Akritikarki126@gmail.com</a></p>
                </div>
              </div>

              <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6647.603606893961!2d-101.8751391!3d33.584494899999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8640c413f31ec847%3A0x52db374b7b07849!2sTexas%20Tech%20University!5e0!3m2!1sen!2sus!4v1752859173404!5m2!1sen!2sus"
                frameborder="0"
                style="border:0; width: 100%; height: 270px;"
                allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
              </iframe>

            </div>
          </div>

          <div class="col-lg-7">
            <form id="contactForm" class="php-email-form" data-aos="fade-up" data-aos-delay="200" novalidate>
              <div class="row gy-4">

                <div class="col-md-6">
                  <label for="name-field" class="pb-2">Your Name</label>
                  <input type="text" name="name" id="name-field" class="form-control" required>
                </div>

                <div class="col-md-6">
                  <label for="email-field" class="pb-2">Your Email</label>
                  <input type="email" name="email" id="email-field" class="form-control" required>
                </div>

                <div class="col-md-12">
                  <label for="subject-field" class="pb-2">Subject</label>
                  <input type="text" name="subject" id="subject-field" class="form-control" required>
                </div>

                <div class="col-md-12">
                  <label for="message-field" class="pb-2">Message</label>
                  <textarea class="form-control" name="message" rows="10" id="message-field" required></textarea>
                </div>

                <div class="col-md-12 text-center">
                  <div class="loading" id="loadingMsg" style="display:none;">Sending…</div>
                  <div class="error-message" id="errorMsg" style="display:none;"></div>
                  <div class="sent-message" id="successMsg" style="display:none;">Your message has been sent. Thank you!</div>
                  <button type="submit">Send Message</button>
                </div>

              </div>
            </form>
          </div>

        </div>
      </div>

  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const form       = e.target;
      const loading    = document.getElementById('loadingMsg');
      const errorMsg   = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      loading.style.display    = 'block';
      errorMsg.style.display   = 'none';
      successMsg.style.display = 'none';

      emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        from_name:  form.name.value.trim(),
        from_email: form.email.value.trim(),
        subject:    form.subject.value.trim(),
        message:    form.message.value.trim(),
      })
      .then(function () {
        loading.style.display    = 'none';
        successMsg.style.display = 'block';
        form.reset();
      })
      .catch(function (error) {
        loading.style.display  = 'none';
        errorMsg.style.display = 'block';
        errorMsg.textContent   = 'Something went wrong. Please try again or email directly.';
        console.error('EmailJS error:', error);
      });
    });
  </script>
