
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Search Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">Search the Internet</h2>
    <div class="row g-4">
      <div class="col-md-6">
        <form id="googleForm" action="https://www.google.com/search" method="get" target="_blank" class="border p-3 rounded bg-light" onsubmit="return validateForm('googleInput')">
          <h5>Google Search</h5>
          <div class="mb-3">
            <input type="text" id="googleInput" name="q" class="form-control" placeholder="Search Google..." required>
          </div>
          <button type="submit" class="btn btn-primary">Search Google</button>
        </form>
      </div>
      </div>
      <div class="col-md-6">
        <form id="yahooForm" action="https://search.yahoo.com/search" method="get" target="_blank" class="border p-3 rounded bg-light" onsubmit="return validateForm('yahooInput')">
          <h5>Yahoo Search</h5>
          <div class="mb-3">
            <input type="text" id="yahooInput" name="p" class="form-control" placeholder="Search Yahoo..." required>
          </div>
          <button type="submit" class="btn btn-warning">Search Yahoo</button>
        </form>
      </div>
      <div class="col-md-6">
        <form id="bingForm" action="https://www.bing.com/search" method="get" target="_blank" class="border p-3 rounded bg-light" onsubmit="return validateForm('bingInput')">
          <h5>Bing Search</h5>
          <div class="mb-3">
            <input type="text" id="bingInput" name="q" class="form-control" placeholder="Search Bing..." required>
          </div>
          <button type="submit" class="btn btn-info">Search Bing</button>
        </form>
      </div>
      <div class="col-md-6">
        <form id="duckForm" action="https://duckduckgo.com/" method="get" target="_blank" class="border p-3 rounded bg-light" onsubmit="return validateForm('duckInput')">
          <h5>DuckDuckGo Search</h5>
          <div class="mb-3">
            <input type="text" id="duckInput" name="q" class="form-control" placeholder="Search DuckDuckGo..." required>
          </div>
          <button type="submit" class="btn btn-success">Search DuckDuckGo</button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function validateForm(inputId) {
      var input = document.getElementById(inputId).value.trim();
      if (input === "") {
        document.getElementById(inputId).focus();
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
